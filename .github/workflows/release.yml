name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Import signing certificate
        if: env.CERTIFICATE_P12 != ''
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm $RUNNER_TEMP/certificate.p12

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Build, sign, and notarize
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PATH: ${{ runner.temp }}/signing.keychain-db
        run: |
          chmod +x Scripts/build-app.sh
          Scripts/build-app.sh

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH=${{ runner.temp }}/signing.keychain-db
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Get SHA256
        run: |
          SHA=$(shasum -a 256 .build/Barred.zip | awk '{print $1}')
          echo "SHA256=$SHA" >> $GITHUB_ENV
          echo "SHA256: $SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Barred v${{ env.VERSION }}
          body: |
            ## Barred v${{ env.VERSION }}

            ### Install via Homebrew
            ```bash
            brew tap mcclowes/barred
            brew install --cask barred
            ```

            ### Manual install
            Download `Barred.zip`, extract, and move `Barred.app` to `/Applications`.

            **SHA256:** `${{ env.SHA256 }}`
          files: .build/Barred.zip
          draft: false
          prerelease: false

      - name: Update Homebrew cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mcclowes/homebrew-barred.git $RUNNER_TEMP/homebrew-barred

          cat > $RUNNER_TEMP/homebrew-barred/Casks/barred.rb << 'CASK'
          cask "barred" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_PLACEHOLDER"

            url "https://github.com/mcclowes/barred/releases/download/v#{version}/Barred.zip"
            name "Barred"
            desc "macOS menu bar manager"
            homepage "https://github.com/mcclowes/barred"

            depends_on macos: ">= :sonoma"

            app "Barred.app"

            zap trash: [
              "~/Library/Preferences/com.barred.app.plist",
            ]
          end
          CASK

          # Replace placeholders
          sed -i '' "s/VERSION_PLACEHOLDER/$VERSION/" $RUNNER_TEMP/homebrew-barred/Casks/barred.rb
          sed -i '' "s/SHA_PLACEHOLDER/$SHA256/" $RUNNER_TEMP/homebrew-barred/Casks/barred.rb

          cd $RUNNER_TEMP/homebrew-barred
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/barred.rb
          git commit -m "Update barred to v$VERSION"
          git push
