name: Release

on:
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false
      candidate:
        type: string
        default: ""
      fingerprint:
        type: string
        default: ""
      nightly_tag:
        type: string
        default: ""
      nightly_version:
        type: string
        default: ""
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  build:
    runs-on: macos-26
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NIGHTLY_SHA: ${{ inputs.candidate }}
      NIGHTLY_FINGERPRINT: ${{ inputs.fingerprint }}
      NIGHTLY_TAG: ${{ inputs.nightly_tag }}
      NIGHTLY_VERSION: ${{ inputs.nightly_version }}
      NIGHTLY_TAP_PATH: ${{ github.workspace }}/nightly-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Run tests
        run: make test

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build and sign release
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          nightly_version_args=()
          if [ -n "$NIGHTLY_VERSION" ]; then
            nightly_version_args=(MARKETING_VERSION="$NIGHTLY_VERSION" CURRENT_PROJECT_VERSION="$NIGHTLY_VERSION")
          fi
          xcodebuild -project Barred.xcodeproj \
            -scheme Barred \
            -configuration Release \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build "${nightly_version_args[@]}"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUILD_SETTINGS=$(xcodebuild -project Barred.xcodeproj -scheme Barred -configuration Release -showBuildSettings) || exit $?
          BUILD_DIR=$(awk '/^[[:space:]]*BUILT_PRODUCTS_DIR[[:space:]]*=/ { sub(/^[[:space:]]*BUILT_PRODUCTS_DIR[[:space:]]*=[[:space:]]*/, ""); print; exit }' <<< "$BUILD_SETTINGS")
          test -n "$BUILD_DIR" || { echo 'Xcode did not report a build products directory.' >&2; exit 1; }
          APP_PATH="$BUILD_DIR/Barred.app"

          ditto -c -k --keepParent "$APP_PATH" "$BUILD_DIR/Barred.zip"

          SUBMISSION_OUTPUT=$(xcrun notarytool submit "$BUILD_DIR/Barred.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1) || true
          echo "$SUBMISSION_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMISSION_OUTPUT" | grep -m1 'id:' | awk '{print $NF}')

          if echo "$SUBMISSION_OUTPUT" | grep -q "status: Invalid"; then
            echo "Notarization failed — fetching log:"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$TEAM_ID"
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"

          rm "$BUILD_DIR/Barred.zip"
          ditto -c -k --keepParent "$APP_PATH" "$BUILD_DIR/Barred.zip"

      - name: Find artifact
        id: artifact
        run: |
          BUILD_SETTINGS=$(xcodebuild -project Barred.xcodeproj -scheme Barred -configuration Release -showBuildSettings) || exit $?
          BUILD_DIR=$(awk '/^[[:space:]]*BUILT_PRODUCTS_DIR[[:space:]]*=/ { sub(/^[[:space:]]*BUILT_PRODUCTS_DIR[[:space:]]*=[[:space:]]*/, ""); print; exit }' <<< "$BUILD_SETTINGS")
          test -n "$BUILD_DIR" || { echo 'Xcode did not report a build products directory.' >&2; exit 1; }
          cask_arches=$(bash Scripts/cask-architectures.sh "${BUILD_DIR}/Barred.app/Contents/MacOS/Barred")
          {
            echo "zip_path=${BUILD_DIR}/Barred.zip"
            echo "sha256=$(shasum -a 256 "${BUILD_DIR}/Barred.zip" | awk '{print $1}')"
            echo "cask_arches=$cask_arches"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ !inputs.nightly }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          files: ${{ steps.artifact.outputs.zip_path }}
          body: |
            ## Barred ${{ github.ref_name }}

            **Install via Homebrew:**
            ```
            brew install mcclowes/barred/barred
            ```

            **SHA256:** `${{ steps.artifact.outputs.sha256 }}`
          draft: false
          prerelease: false

      - name: Update Homebrew tap
        if: ${{ !inputs.nightly }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${NIGHTLY_VERSION:-${GITHUB_REF_NAME#v}}"
          CASK_CONTENT=$(cat <<CASKEOF
          cask "barred" do
            version "${VERSION}"
            sha256 "${{ steps.artifact.outputs.sha256 }}"

            url "https://github.com/mcclowes/barred/releases/download/v#{version}/Barred.zip"
            name "Barred"
            desc "Native menu bar manager"
            homepage "https://github.com/mcclowes/barred"

            depends_on arch: [${{ steps.artifact.outputs.cask_arches }}]
            depends_on macos: :sonoma

            app "Barred.app"

            zap trash: [
              "~/Library/Application Support/Barred",
              "~/Library/Preferences/com.mcclowes.barred.plist",
            ]
          end
          CASKEOF
          )

          FILE_SHA=$(gh api repos/mcclowes/homebrew-barred/contents/Casks/barred.rb -q .sha 2>/dev/null || echo "")

          if [ -n "$FILE_SHA" ]; then
            gh api repos/mcclowes/homebrew-barred/contents/Casks/barred.rb \
              -X PUT \
              -f message="Update barred to ${{ github.ref_name }}" \
              -f content="$(echo "$CASK_CONTENT" | base64)" \
              -f sha="$FILE_SHA"
          else
            gh api repos/mcclowes/homebrew-barred/contents/Casks/barred.rb \
              -X PUT \
              -f message="Add barred ${{ github.ref_name }}" \
              -f content="$(echo "$CASK_CONTENT" | base64)"
          fi

      - name: Check out the nightly tap
        if: ${{ inputs.nightly }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mcclowes/homebrew-barred
          path: nightly-tap
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Publish the verified nightly
        if: ${{ inputs.nightly }}
        env:
          TAP_GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NIGHTLY_ARTIFACT: ${{ steps.artifact.outputs.zip_path }}
        run: node Scripts/nightly-release.mjs publish

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
