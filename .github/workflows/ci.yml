name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: >
          xcodebuild -project Barred.xcodeproj -scheme Barred -configuration Debug
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build

      - name: Test
        run: >
          xcodebuild -project Barred.xcodeproj -scheme Barred -configuration Debug
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO test

  format-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check formatting
        run: make format-check
