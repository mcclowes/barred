name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: brew install swiftformat swiftlint shellcheck

      - name: Check release helpers
        run: |
          bash -n Scripts/build-app.sh Scripts/test-build-app.sh \
            Scripts/cask-architectures.sh Scripts/test-cask-architectures.sh
          shellcheck Scripts/build-app.sh Scripts/test-build-app.sh \
            Scripts/cask-architectures.sh Scripts/test-cask-architectures.sh
          make test-build-helper test-cask-helper

      - name: Lint
        run: make lint

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make generate

      - name: Build and test
        run: make test
