name: Tag Release on Version Bump Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'bump/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Extract version from branch name
        id: version
        env:
          BUMP_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ ! "$BUMP_BRANCH" =~ ^bump/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid version-bump branch" >&2
            exit 1
          fi
          TAG="${BUMP_BRANCH#bump/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tagging as $TAG"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Delete bump branch
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git push origin --delete "$BUMP_BRANCH" || true
