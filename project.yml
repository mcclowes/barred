name: Barred
options:
  bundleIdPrefix: com.mcclowes
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Barred:
    type: application
    platform: macOS
    sources:
      - Sources/Barred
      - path: barred.icon
    dependencies:
      - sdk: ScreenCaptureKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcclowes.barred
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: 2
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Barred.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: barred
        CODE_SIGN_IDENTITY: "-"
    entitlements:
      path: Resources/Barred.entitlements

  BarredTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/BarredTests
    dependencies:
      - target: Barred
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcclowes.barred.tests
        GENERATE_INFOPLIST_FILE: true
