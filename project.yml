name: Barman
options:
  bundleIdPrefix: com.mcclowes
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Barman:
    type: application
    platform: macOS
    sources:
      - Sources/Barman
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcclowes.barman
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Barman.entitlements
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Barman Dev"
    entitlements:
      path: Resources/Barman.entitlements

  BarmanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/BarmanTests
    dependencies:
      - target: Barman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcclowes.barman.tests
        GENERATE_INFOPLIST_FILE: true
